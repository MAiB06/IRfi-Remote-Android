name: Build IRfi Remote

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: Stage 2 source ZIP in repository root
        required: true
        type: string
        default: IRfi_Remote_Stage2_ReleaseReady.zip
      publish_release:
        description: Publish this build as a GitHub Release?
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"
      build_version:
        description: Release version (for example 0.1.0)
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.build_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Stage 2 source
        id: source
        shell: bash
        env:
          SOURCE_ARCHIVE: ${{ inputs.source_archive }}
        run: |
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            if [[ ! -f "$GITHUB_WORKSPACE/$SOURCE_ARCHIVE" ]]; then
              echo "::error::Cannot find $SOURCE_ARCHIVE in the repository root. Upload the Stage 2 ZIP first."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/irfi-source"
            unzip -q "$GITHUB_WORKSPACE/$SOURCE_ARCHIVE" -d "$RUNNER_TEMP/irfi-source"
            PROJECT_DIR="$(find "$RUNNER_TEMP/irfi-source" -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi
          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::The archive does not contain a valid IRfi Android project."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check release signing secrets
        if: inputs.publish_release == 'yes'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing value: $name. Add the four ANDROID_* repository secrets described in the setup file."
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Decode signing keystore
        if: inputs.publish_release == 'yes'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/irfi-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/irfi-release.jks" -storepass '${{ secrets.ANDROID_STORE_PASSWORD }}' >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/irfi-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: inputs.publish_release == 'yes'
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleRelease :app:bundleRelease -PappVersionName="$RELEASE_VERSION"

      - name: Build debug APK (also for testing)
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug -PappVersionName="$RELEASE_VERSION"

      - name: Collect and verify outputs
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/IRfi-Remote-debug.apk
          if [[ "${{ inputs.publish_release }}" == "yes" ]]; then
            cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" output/IRfi-Remote-release.apk
            cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" output/IRfi-Remote-release.aab
            test -s output/IRfi-Remote-release.apk
            test -s output/IRfi-Remote-release.aab
            jarsigner -verify output/IRfi-Remote-release.aab >/dev/null
          fi
          ls -lh output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IRfi-Remote-${{ inputs.build_version }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: inputs.publish_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.build_version }}
          name: IRfi Remote ${{ inputs.build_version }}
          generate_release_notes: true
          files: |
            output/IRfi-Remote-release.apk
            output/IRfi-Remote-release.aab
