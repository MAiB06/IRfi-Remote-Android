name: Build IRfi Remote

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: Source ZIP in the repository root (leave default unless renamed)
        required: true
        type: string
        default: IRfi_Remote_Stage2_Source.zip
      publish_release:
        description: Publish a GitHub Release? Requires signed release outputs.
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      build_version:
        description: Optional version name (for example 0.1.1)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.build_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source
        id: source
        shell: bash
        env:
          SOURCE_ARCHIVE: ${{ inputs.source_archive }}
        run: |
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]]; then
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          elif [[ -f "$GITHUB_WORKSPACE/$SOURCE_ARCHIVE" ]]; then
            mkdir -p "$RUNNER_TEMP/irfi-source"
            unzip -q "$GITHUB_WORKSPACE/$SOURCE_ARCHIVE" -d "$RUNNER_TEMP/irfi-source"
            if [[ -f "$RUNNER_TEMP/irfi-source/IRfi_Remote/settings.gradle.kts" ]]; then
              PROJECT_DIR="$RUNNER_TEMP/irfi-source/IRfi_Remote"
            else
              PROJECT_DIR="$(find "$RUNNER_TEMP/irfi-source" -name settings.gradle.kts -print -quit | xargs -r dirname)"
            fi
            if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
              echo "::error::Could not find settings.gradle.kts in the source archive."
              exit 1
            fi
            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Gradle project found and source ZIP '$SOURCE_ARCHIVE' is missing."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && -n "$STORE_PASSWORD" ]]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/irfi-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/irfi-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured; signed release outputs will be skipped."
          fi

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            gradle -p "$PROJECT_DIR" :app:assembleDebug -PappVersionName="$RELEASE_VERSION"
          else
            gradle -p "$PROJECT_DIR" :app:assembleDebug
          fi

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            gradle -p "$PROJECT_DIR" :app:assembleRelease :app:bundleRelease -PappVersionName="$RELEASE_VERSION"
          else
            gradle -p "$PROJECT_DIR" :app:assembleRelease :app:bundleRelease
          fi

      - name: Prepare artifacts
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/IRfi-Remote-debug.apk

          if [[ -f "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" ]]; then
            cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" output/IRfi-Remote-release.apk
          fi

          if [[ -f "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" ]]; then
            cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" output/IRfi-Remote-release.aab
          fi

          echo "Build outputs:"
          ls -lh output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IRfi-Remote-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Verify release outputs before publishing
        if: inputs.publish_release == 'yes'
        shell: bash
        run: |
          test -f output/IRfi-Remote-release.apk
          test -f output/IRfi-Remote-release.aab

      - name: Publish GitHub Release
        if: inputs.publish_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION || github.run_number }}
          name: IRfi Remote ${{ env.RELEASE_VERSION || format('Build {0}', github.run_number) }}
          generate_release_notes: true
          files: |
            output/IRfi-Remote-release.apk
            output/IRfi-Remote-release.aab
